
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>R.P.R Textile - Categories</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6fa;
    color: #17233c;
}

/* Header */
header {
    background: #071d49;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

header h1 {
    font-size: clamp(25px, 4vw, 38px);
    letter-spacing: 2px;
}

header p {
    margin-top: 8px;
    color: #dce8ff;
}

/* Page Title */
.section-title {
    text-align: center;
    margin: 35px 15px 25px;
}

.section-title h2 {
    font-size: 28px;
    margin-bottom: 10px;
}

.section-title p {
    color: #65718a;
}

/* Category Grid */
.categories {
    width: 92%;
    max-width: 1200px;
    margin: 0 auto 45px;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 25px;
}

/* Category Card */
.category-card {
    display: block;
    text-decoration: none;
    color: #17233c;
    background: white;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.09);
    transition: transform 0.25s, box-shadow 0.25s;
}

.category-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

.category-card img {
    display: block;
    width: 100%;
    height: 220px;
    object-fit: cover;
}

.category-card h3 {
    text-align: center;
    padding: 18px 8px;
    font-size: 20px;
}

/* Footer */
footer {
    background: #071d49;
    color: white;
    text-align: center;
    padding: 20px;
}

.home-btn {
    display: inline-block;
    margin-top: 20px;
    padding: 11px 22px;
    background: #ffffff;
    color: #071d49;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
}

/* Tablet */
@media (max-width: 800px) {
    .categories {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
    }

    .category-card img {
        height: 190px;
    }
}

/* Mobile */
@media (max-width: 480px) {
    .categories {
        width: 92%;
        gap: 12px;
    }

    .category-card img {
        height: 140px;
    }

    .category-card h3 {
        font-size: 16px;
        padding: 14px 5px;
    }
}
</style>
</head>

<body>

<header>
    <h1>R.P.R TEXTILE</h1>
    <p>Clothing | Fancy | Shoes | Stationery</p>
</header>

<section class="section-title">

   
</section>

<main class="categories">

    <!-- Men -->
    <a href="men.html" class="category-card">
        <img
            src="https://images.unsplash.com/photo-1617137968427-85924c800a22?auto=format&fit=crop&w=700&q=80"
            alt="Men's Clothing">
        <h3>Men</h3>
    </a>

    <!-- Women -->
    <a href="women.html" class="category-card">
        <img
            src="https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=700&q=80"
            alt="Women's Fashion">
        <h3>Women</h3>
    </a>

    <!-- Children -->
    <a href="children.html" class="category-card">
        <img
            src="https://images.unsplash.com/photo-1503919005314-30d93d07d823?auto=format&fit=crop&w=700&q=80"
            alt="Children's Clothing">
        <h3>Children</h3>
    </a>

    <!-- Shoes -->
    <a href="shoes.html" class="category-card">
        <img
            src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=700&q=80"
            alt="Shoes">
        <h3>Shoes</h3>
    </a>

    <!-- Fancy -->
    <a href="fancy.html" class="category-card">
        <img
            src="https://images.unsplash.com/photo-1617038220319-276d3cfab638?auto=format&fit=crop&w=700&q=80"
            alt="Fancy Accessories">
        <h3>Fancy</h3>
    </a>

    <!-- Stationery -->
    <a href="stationery.html" class="category-card">
        <img
            src="https://images.unsplash.com/photo-1455390582262-044cdead277a?auto=format&fit=crop&w=700&q=80"
            alt="Stationery">
        <h3>Stationery</h3>
    </a>

</main>

<footer>
    <p>© 2026 R.P.R Textile. All Rights Reserved.</p>
    <a href="index.html" class="home-btn">Back to Home</a>
</footer>

</body>
</html>
