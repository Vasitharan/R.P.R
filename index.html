
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R.P.R Textile Banner</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
}

/* Banner Size and Design */
.banner {
    width: 100%;
    min-height: 400px;
    background: linear-gradient(135deg, #061B49, #087FEA);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
    color: white;
    overflow: hidden;
}

.banner-content {
    width: 100%;
    max-width: 1200px;
}

.banner h1 {
    font-size: clamp(32px, 5vw, 65px);
    font-weight: 800;
    letter-spacing: 3px;
    margin-bottom: 18px;
}

.banner p {
    font-size: clamp(16px, 2vw, 25px);
    margin-bottom: 30px;
}

.banner a {
    display: inline-block;
    background: white;
    color: #061B49;
    padding: 14px 32px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
    transition: 0.3s;
}

.banner a:hover {
    background: #FFD700;
    transform: translateY(-3px);
}

/* Mobile Screen */
@media (max-width: 600px) {
    .banner {
        min-height: 250px;
        padding: 30px 15px;
    }

    .banner h1 {
        letter-spacing: 1px;
    }
}
</style>
</head>

<body>

<section class="banner">
    <div class="banner-content">
        <h1>R.P.R TEXTILE</h1>
        <p>Clothing | Fancy | Shoes</p>
        <a href="next.html">Explore Now</a>
    </div>
</section>

</body>
</html>
